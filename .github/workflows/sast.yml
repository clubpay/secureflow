name: Static Application Security Testing

on:
  workflow_dispatch:  # This allows manual trigger
  workflow_call:  # Allows this workflow to be reusable by other repositories
      inputs:
        FORCE_DEFECTDOJO_UPLOAD:
          required: false
          type: boolean
          default: false   # upload from any branch (smoke tests); normally only the default branch uploads
        DEFECTDOJO_PRODUCT_NAME:
          required: false
          type: string     # DefectDojo product name; defaults to the repository name
        SAST_EXCLUDE_LIST:
          required: false
          type: string # space separated list of files/folders to exclude from scan
      secrets:
        GLOBAL_REPO_TOKEN:
          required: false
        DEFECTDOJO_TOKEN:
          required: false

jobs:
  sast:
    concurrency:   # one import at a time per repo+scan; never cancel a running import
      group: secureflow-sast-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    env:
      EXCLUDED_RULES: "--exclude-rule=ajinabraham.njsscan.database.nosql_find_injection.node_nosqli_injection --exclude-rule=generic.secrets.security.detected-generic-secret.detected-generic-secret --exclude-rule=generic.secrets.security.detected-stripe-api-key.detected-stripe-api-key --exclude-rule=generic.secrets.security.detected-telegram-bot-api-key.detected-telegram-bot-api-key --exclude-rule=generic.secrets.security.detected-private-key.detected-private-key --exclude-rule=generic.secrets.security.detected-bcrypt-hash.detected-bcrypt-hash --exclude-rule=generic.secrets.security.detected-jwt-token.detected-jwt-token --exclude-rule=mobsf.mobsfscan.android.secrets.hardcoded_api_key --exclude-rule=mobsf.mobsfscan.android.secrets.hardcoded_username --exclude-rule=generic.secrets.security.detected-generic-api-key.detected-generic-api-key --exclude-rule=mobsf.mobsfscan.android.secrets.hardcoded_password --exclude-rule=mobsf.mobsfscan.android.secrets.hardcoded_secret --exclude-rule=ajinabraham.njsscan.generic.hardcoded_secrets.node_password --exclude-rule=ajinabraham.njsscan.generic.hardcoded_secrets.node_api_key --exclude-rule=generic.secrets.security.detected-npm-registry-auth-token.detected-npm-registry-auth-token --exclude-rule=generic.secrets.security.detected-aws-secret-access-key.detected-aws-secret-access-key --exclude-rule=generic.secrets.security.detected-aws-access-key-id-value.detected-aws-access-key-id-value --exclude-rule=generic.secrets.security.detected-github-token.detected-github-token --exclude-rule=generic.secrets.security.detected-username-and-password-in-uri.detected-username-and-password-in-uri --exclude-rule=ajinabraham.njsscan.generic.hardcoded_secrets.node_username"

    steps:
    # Step 1: Checkout the code from the repository
    - name: Checkout Repository
      uses: actions/checkout@v4
      with: #if the repo is public and GLOBAL_REPO_TOKEN is not present, we use the default token generated in the Github action to prevent errors
        token: ${{ secrets.GLOBAL_REPO_TOKEN || github.token }}
      
    # Step 2: Remove sast_exclude_list
    - name: Remove files/dirs according to gitignore-style patterns
      shell: bash
      run: |
        #Ensure safe execution (fail fast on errors, catch unset variables, detect pipeline errors)
        set -euo pipefail
        #Enable flexible recursive globbing, including hidden files, and avoids issues with unmatched patterns
        shopt -s globstar nullglob dotglob
    
        # Convert space-separated SAST_EXCLUDE_LIST into array
        read -ra patterns <<< "${{ inputs.SAST_EXCLUDE_LIST }}"
    
        # Array to store files/dirs to delete
        declare -a to_delete=()
    
        for pattern in "${patterns[@]}"; do
          # Skip blank lines and comments
          [[ -z "$pattern" || "$pattern" =~ ^# ]] && continue
    
          # Handle negation
          negate=false
          if [[ "$pattern" == !* ]]; then
            negate=true
            pattern="${pattern:1}"
          fi
    
          echo "Processing pattern: $pattern (negate=$negate)"
    
          # Determine if pattern is directory-only
          dir_only=false
          if [[ "$pattern" == */ ]]; then
            dir_only=true
            pattern="${pattern%/}"
          fi
    
          # Root-only pattern
          root_only=false
          if [[ "$pattern" == /* ]]; then
            root_only=true
            pattern="${pattern#/}"
          fi
    
          # Generate matches
          matches=()
          if $root_only; then
            if $dir_only; then
              [[ -d "$pattern" ]] && matches+=("$pattern")
            else
              [[ -e "$pattern" ]] && matches+=("$pattern")
            fi
          else
            if $dir_only; then
              # directories recursively
              while IFS= read -r d; do
                matches+=("$d")
              done < <(find . -type d -path "./$pattern" 2>/dev/null)
            else
              # files and dirs recursively
              while IFS= read -r f; do
                matches+=("$f")
              done < <(find . -path "./$pattern" 2>/dev/null)
            fi
          fi
    
          # Apply negation: remove from deletion list
          if $negate; then
            for m in "${matches[@]}"; do
              for i in "${!to_delete[@]}"; do
                [[ "${to_delete[i]}" == "$m" ]] && unset 'to_delete[i]'
              done
            done
          else
            to_delete+=("${matches[@]}")
          fi
        done
    
        # Remove duplicates
        IFS=$'\n' read -r -d '' -a to_delete < <(printf '%s\n' "${to_delete[@]}" | sort -u && printf '\0')
    
        # Delete all collected files/dirs
        for f in "${to_delete[@]}"; do
          echo "Removing: $f"
          rm -rf "$f"
        done
        
    # Step 3: Default exclusions (tests, mocks, fixtures, generated code)
    # A repo-root .semgrepignore REPLACES Semgrep's built-in ignore list, so the
    # built-ins are repeated here; the repo's own .semgrepignore (if any) is kept.
    - name: Apply SecureFlow Default Exclusions
      run: |
        [ -f .semgrepignore ] && echo "" >> .semgrepignore
        cat >> .semgrepignore <<'EOF'
        # SecureFlow default exclusions (appended to the repo's own .semgrepignore, if any).
        # A repo-root .semgrepignore REPLACES Semgrep's built-in defaults, so those are repeated here.

        # Semgrep's built-in defaults
        .git/
        node_modules/
        vendor/
        dist/
        build/
        *.min.js

        # CI caches inside the checkout (downloaded dependencies, not our code)
        .cache/
        .go/

        # Test code, mocks and fixtures (never shipped)
        test/
        tests/
        __tests__/
        __mocks__/
        __fixtures__/
        mocks/
        mock/
        fixtures/
        testdata/
        spec/
        e2e/
        cypress/
        *_test.go
        *_mock.go
        mock_*.go
        *.spec.js
        *.spec.jsx
        *.spec.ts
        *.spec.tsx
        *.test.js
        *.test.jsx
        *.test.ts
        *.test.tsx
        test_*.py
        *_test.py
        conftest.py

        # Vendored front-end bundles (not ours; slow to parse, time out rules)
        *swagger-ui*
        *.bundle.js

        # Generated code
        *.pb.go
        *.pb.gw.go
        *_pb2.py
        *_pb2_grpc.py
        EOF

    # Step 4: Run Semgrep. The GitLab SAST report is what DefectDojo imports
    # (its ids are stable across runs); the JSON report only feeds the filter
    # below with rule metadata (the OSS JSON has no usable fingerprint).
    - name: Run Semgrep Scan
      run: |
        EXIT_CODE=0
        docker run --rm -v "${PWD}:/src" semgrep/semgrep:1.178.0 semgrep ci $EXCLUDED_RULES --metrics=off --exclude=*.yml --exclude=*.yaml --exclude=*.json --exclude=*docker* --exclude=*Docker* --config=p/mobsfscan --config=p/nodejsscan --config=p/owasp-top-ten --config=p/cwe-top-25 --config=p/security-audit --config=p/default --config=p/mcp --config=p/ai-best-practices --gitlab-sast-output=semgrep-report-raw.json --json-output=semgrep-metadata.json || EXIT_CODE=$?
        if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 1 ]; then exit "$EXIT_CODE"; fi

    # Step 5: Drop secret rules (Gitleaks owns secrets) and INFO-level notices.
    # Decided per rule from its metadata, so new registry rules are covered too.
    - name: Filter Semgrep Report
      shell: python3 {0}
      run: |
        import json, re
        SECRET_CWE = re.compile(r"CWE-(798|259|321)\b", re.I)   # hard-coded credentials, password, key
        SECRET_ID = re.compile(r"(hardcod|(^|[._-])secrets?([._-]|$)|node_password|node_username|node_api_key|api[-_]?key)", re.I)
        drop = {}
        for r in json.load(open("semgrep-metadata.json")).get("results", []):
            ex = r["extra"]; m = ex.get("metadata") or {}
            cwe = m.get("cwe") or []
            cwe = " ".join(cwe) if isinstance(cwe, list) else str(cwe)
            if ex.get("severity") == "INFO":
                drop[r["check_id"]] = "info"
            elif ("secrets" in [str(t).lower() for t in (m.get("technology") or [])]
                  or SECRET_CWE.search(cwe) or SECRET_ID.search(r["check_id"])):
                drop[r["check_id"]] = "secret"
        report = json.load(open("semgrep-report-raw.json"))
        vulns = report.get("vulnerabilities", [])
        rule_of = lambda v: str(v.get("cve", "")).rsplit(":", 1)[-1]   # "<path>:<hash>:<rule id>"
        report["vulnerabilities"] = [v for v in vulns if rule_of(v) not in drop]
        json.dump(report, open("semgrep-report.json", "w"))
        print("kept %d of %d findings; dropped rules:" % (len(report["vulnerabilities"]), len(vulns)))
        for rule, why in sorted(drop.items()):
            print("  %-6s %s" % (why, rule))

    # Only the default branch's state goes to DefectDojo: an import closes every
    # finding of the product that is absent from it (close_old_findings, product
    # scope), so feature-branch and PR scans used to close live findings and
    # re-create them on the next run. Other branches scan and keep the report
    # as an artifact.
    - name: Decide DefectDojo Upload
      id: gate
      env:
        FORCE: ${{ inputs.FORCE_DEFECTDOJO_UPLOAD }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ "$FORCE" = "true" ] || { [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; }; then
          echo "upload=true" >> "$GITHUB_OUTPUT"
        else
          echo "upload=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$GITHUB_REF_NAME is not the default branch ($DEFAULT_BRANCH): scan only, no DefectDojo upload"
        fi

    # Step 6: Fetching Binaries for Teleport
    - name: Fetch Teleport Binaries
      if: steps.gate.outputs.upload == 'true'
      uses: teleport-actions/setup@v1
      with:
        version: 18.1.0
    
    # Step 7: Fetching Credentials
    - name: Fetch Credentials Using Machine ID
      if: steps.gate.outputs.upload == 'true'
      id: auth
      uses: teleport-actions/auth-application@v2
      with:
        proxy: teleport.qlub.cloud:443
        token: defectdojo-github-action
        app: defectdojo-hz
        anonymous-telemetry: 0
    
    # Step 8: Upload to Defectdojo Behind Teleport
    - name: Upload Semgrep JSON Report to Defectdojo
      env:
        DD_PRODUCT_NAME: ${{ inputs.DEFECTDOJO_PRODUCT_NAME }}
      if: steps.gate.outputs.upload == 'true'
      run: |
        TODAY=$(date +%Y-%m-%d)
        product_name="${DD_PRODUCT_NAME:-$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)}"
        curl --cert ${{ steps.auth.outputs.certificate-file }} --key ${{ steps.auth.outputs.key-file }} -X "POST" "https://defectdojo-hz.teleport.qlub.cloud/api/v2/import-scan/" -H "accept: application/json" -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" -H "Content-Type: multipart/form-data" -F file=@semgrep-report.json -F "product_type_name=Clubpay" -F "active=true" -F "verified=true" -F "close_old_findings=true" -F "engagement_name=${GITHUB_RUN_ID}(SAST)" -F "build_id=${GITHUB_RUN_ID}" -F "minimum_severity=Info" -F "close_old_findings_product_scope=true" -F "scan_date=$TODAY" -F "engagement_end_date=$TODAY" -F "commit_hash=${GITHUB_SHA}" -F "product_name=${product_name}" -F "auto_create_context=true" -F "scan_type=GitLab SAST Report" -F "branch_tag=${GITHUB_REF_NAME}" -F "source_code_management_uri=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
        
    # Step 9: Upload the Semgrep Report as an Artifact
    - name: Upload Semgrep Report to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: semgrep-report
        path: |
          semgrep-report.json
          semgrep-report-raw.json
