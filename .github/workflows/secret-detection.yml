name: Secret Detection

on:
  workflow_dispatch:  # Allows manual trigger
  workflow_call:  # Allows this workflow to be reusable by other repositories
    inputs:
      FORCE_DEFECTDOJO_UPLOAD:
        required: false
        type: boolean
        default: false   # upload from any branch (smoke tests); normally only the default branch uploads
      DEFECTDOJO_PRODUCT_NAME:
        required: false
        type: string     # DefectDojo product name; defaults to the repository name
      SECRET_DETECTION_EXCLUDE_LIST:
        required: false
        type: string # space separated list of files/folders to exclude from scan
    secrets:
      GLOBAL_REPO_TOKEN:
        required: false
      DEFECTDOJO_TOKEN:
        required: false

jobs:
  secret-detection:
    concurrency:   # one import at a time per repo+scan; never cancel a running import
      group: secureflow-secret-detection-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the code from the repository
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GLOBAL_REPO_TOKEN || github.token }}
        fetch-depth: 0   # full git history

    
    # Step 2: Build the Gitleaks config. Gitleaks scans git HISTORY, so deleting
    # files from the checkout excludes nothing; exclusions must be a path
    # allowlist instead. Defaults (or the repo's own .gitleaks.toml) + test,
    # mock and fixture paths + SECRET_DETECTION_EXCLUDE_LIST (same pattern
    # meaning as the other scans' exclude lists).
    - name: Build Gitleaks Config With Path Exclusions
      shell: python3 {0}
      env:
        EXCLUDES: ${{ inputs.SECRET_DETECTION_EXCLUDE_LIST }}
      run: |
        import os, re

        # Test code, mocks and fixtures are never shipped (same scope as SAST's ignore list).
        DEFAULT_PATHS = [
            r"(^|/)(test|tests|__tests__|__mocks__|__fixtures__|mocks?|fixtures|testdata|spec|e2e|cypress)/",
            r"(^|/)[^/]*_test\.go$", r"(^|/)(mock_[^/]*|[^/]*_mock)\.go$",
            r"(^|/)[^/]*\.(spec|test)\.[jt]sx?$", r"(^|/)(test_[^/]*|[^/]*_test)\.py$", r"(^|/)conftest\.py$",
        ]


        def gitignore_to_regex(pat):
            """One exclude pattern -> a path regex, with the SAME meaning as SecureFlow's
            file-removal step (find . -path "./<pattern>"): relative to the repo root,
            `*` may cross directories, a trailing / means a directory (and everything
            under it), a pattern without one matches a file or a directory."""
            dir_only = pat.endswith("/")
            p = pat.strip("/")
            out, i = "", 0
            while i < len(p):
                if p.startswith("**/", i):
                    out += "(.*/)?"; i += 3
                elif p[i] == "*":
                    out += ".*"; i += 2 if p.startswith("**", i) else 1
                elif p[i] == "?":
                    out += "[^/]"; i += 1
                else:
                    out += re.escape(p[i]); i += 1
            return "^" + out + ("/" if dir_only else "(/|$)")


        def build(excludes, repo_config_exists):
            paths, negated = list(DEFAULT_PATHS), []
            for pat in excludes.split():
                if pat.startswith("#"):
                    continue
                if pat.startswith("!"):
                    negated.append(pat[1:])
                    continue
                paths.append(gitignore_to_regex(pat))
            lines = ["# generated by SecureFlow secret-detection — do not commit", "[extend]"]
            lines.append('path = ".gitleaks.toml"' if repo_config_exists else "useDefault = true")
            lines += ["", "[[allowlists]]", 'description = "SecureFlow path exclusions"', "paths = ["]
            lines += ["  '''%s'''," % p for p in paths]
            lines.append("]")
            return "\n".join(lines) + "\n", negated


        if __name__ == "__main__":
            toml, negated = build(os.environ.get("EXCLUDES", ""), os.path.exists(".gitleaks.toml"))
            open(".secureflow-gitleaks.toml", "w").write(toml)
            print(toml)
            for n in negated:
                print("NOTE: re-include patterns are not supported for secret detection, ignored: !" + n)

    # Step 3: run the scan
    - name: Run Gitleaks Scan
      run: | # Set the working directory to /path to avoid adding any prefix to file paths in Defectdojo
       docker run -v ${PWD}:/path -w /path zricethezav/gitleaks:v8.30.1 git --config .secureflow-gitleaks.toml --log-opts="--all" --platform=github --exit-code 0 --report-path gitleaks-report.json

    # Only the default branch's state goes to DefectDojo: an import closes every
    # finding of the product that is absent from it (close_old_findings, product
    # scope), so feature-branch and PR scans used to close live findings and
    # re-create them on the next run. Other branches scan and keep the report
    # as an artifact.
    - name: Decide DefectDojo Upload
      id: gate
      env:
        FORCE: ${{ inputs.FORCE_DEFECTDOJO_UPLOAD }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ "$FORCE" = "true" ] || { [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; }; then
          echo "upload=true" >> "$GITHUB_OUTPUT"
        else
          echo "upload=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$GITHUB_REF_NAME is not the default branch ($DEFAULT_BRANCH): scan only, no DefectDojo upload"
        fi

    # Step 3b: Stable finding identity. A secret found in several commits is
    # merged by DefectDojo into ONE finding that keeps the FIRST occurrence's
    # description (commit hash + date), and that description is part of the
    # finding hash. Gitleaks' output order varies between runs, so unsorted the
    # same secret is closed and re-created on every scan. Earliest commit first.
    - name: Sort Gitleaks Report
      run: jq 'sort_by(.File, .StartLine, .Date, .Commit, .RuleID)' gitleaks-report.json > gitleaks-sorted.json && mv gitleaks-sorted.json gitleaks-report.json

    # Step 4: Fetching Binaries for Teleport
    - name: Fetch Teleport Binaries
      if: steps.gate.outputs.upload == 'true'
      uses: teleport-actions/setup@v1
      with:
        version: 18.1.0
    
    # Step 5: Fetching Credentials
    - name: Fetch Credentials Using Machine ID
      if: steps.gate.outputs.upload == 'true'
      id: auth
      uses: teleport-actions/auth-application@v2
      with:
        proxy: teleport.qlub.cloud:443
        token: defectdojo-github-action
        app: defectdojo-hz
        anonymous-telemetry: 0

    # Step 6: Upload to Defectdojo Behind Teleport
    - name: Upload Gitleaks JSON Report to Defectdojo
      env:
        DD_PRODUCT_NAME: ${{ inputs.DEFECTDOJO_PRODUCT_NAME }}
      if: steps.gate.outputs.upload == 'true'
      run: |
        TODAY=$(date +%Y-%m-%d)
        product_name="${DD_PRODUCT_NAME:-$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)}"
        curl --cert ${{ steps.auth.outputs.certificate-file }} --key ${{ steps.auth.outputs.key-file }} -X "POST" "https://defectdojo-hz.teleport.qlub.cloud/api/v2/import-scan/" -H "accept: application/json" -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" -H "Content-Type: multipart/form-data" -F file=@gitleaks-report.json -F "product_type_name=Clubpay" -F "active=true" -F "verified=true" -F "close_old_findings=true" -F "engagement_name=${GITHUB_RUN_ID}(Secret-Detection)" -F "build_id=${GITHUB_RUN_ID}" -F "minimum_severity=Info" -F "close_old_findings_product_scope=true" -F "scan_date=$TODAY" -F "engagement_end_date=$TODAY" -F "commit_hash=${GITHUB_SHA}" -F "product_name=${product_name}" -F "auto_create_context=true" -F "scan_type=Gitleaks Scan" -F "branch_tag=${GITHUB_REF_NAME}" -F "source_code_management_uri=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
    
    # Step 7: Upload the Gitleaks report as an artifact
    - name: Upload Gitleaks Report to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gitleaks-report
        path: gitleaks-report.json
